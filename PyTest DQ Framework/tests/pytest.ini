[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra
markers =
	parquet_data: source-to-target data quality checks for Parquet datasets
	smoke: fast availability and non-empty checks
	example: framework usage examples
	facility_name_min_time_spent_per_visit_date: tests for this Parquet dataset
	facility_type_avg_time_spent_per_visit_date: tests for this Parquet dataset
	patient_sum_treatment_cost_per_facility_type: tests for this Parquet dataset
